services:
  - type: web
    name: carbon-track
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Render's free disk is wiped on every deploy, so point this at a
      # Postgres database (for example a free Neon project).
      - key: DATABASE_URL
        sync: false
