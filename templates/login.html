{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="card auth-card">
        <h1>Welcome back</h1>
        <p class="muted">Log in to your dashboard.</p>
        <form method="POST" class="stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ username or '' }}" required autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Log in</button>
        </form>
        <p class="auth-footer">No account yet? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
</div>
{% endblock %}
