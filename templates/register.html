{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="card auth-card">
        <h1>Create your account</h1>
        <p class="muted">Free, and your data stays in your account.</p>
        <form method="POST" class="stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{ username or '' }}" required minlength="3" maxlength="30" autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
                <small class="muted">At least 8 characters.</small>
            </div>
            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
